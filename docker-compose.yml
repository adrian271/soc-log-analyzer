services:
  postgres:
    image: postgres:16-alpine
    container_name: soc-log-analyzer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc_dev_password
      POSTGRES_DB: soc_logs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc_logs"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
